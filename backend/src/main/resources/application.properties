spring.application.name=CampusExchange
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusexchange}
spring.datasource.username=${DB_USER:campus}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
campus.payment-mode=${PAYMENT_MODE:mock}
campus.stripe-key=${STRIPE_SECRET_KEY:}
campus.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
campus.frontend-url=${FRONTEND_URL:http://localhost:5173}
campus.hold-minutes=${HOLD_MINUTES:15}
campus.demo=${DEMO_DATA:false}
stripe.api.key=${STRIPE_SECRET_KEY:}
gemini.api.key=${GEMINI_API_KEY:}
spring.mail.host=${MAIL_HOST:localhost}
debug=false
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework=INFO
